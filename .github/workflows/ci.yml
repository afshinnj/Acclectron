name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run test suite
        run: npm test
      - name: Build portable package
        run: npm run build:portable
      - name: Upload portable package and verification files
        uses: actions/upload-artifact@v7
        with:
          name: Acclectron-portable-${{ github.sha }}
          path: |
            dist/Acclectron-*-portable.zip
            dist/Acclectron-*-portable.sha256
            dist/Acclectron-*-release-manifest.json
          if-no-files-found: error
          retention-days: 14
